; iPhone kontrolcüsü: ESP32 kartı iPhone'a Bluetooth fare + klavye olarak
; bağlanır, Windows uygulamasından USB seri port üzerinden komut alır.

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@1.4.3

; Klasik ESP32 geliştirme kartları (ESP32-WROOM-32, DevKitC, NodeMCU-32S ...)
[env:esp32]
board = esp32dev

; ESP32-S3 DevKitC (USB-UART portundan bağlayın)
[env:esp32s3]
board = esp32-s3-devkitc-1

; ESP32-C3 (ör. Super Mini); yerleşik USB portu seri port olarak görünür
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
