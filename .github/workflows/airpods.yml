name: airpods

on:
  push:
    paths: ["airpods/**", ".github/workflows/airpods.yml"]
  pull_request:
    paths: ["airpods/**", ".github/workflows/airpods.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: airpods
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/AirPodsWin.Core.Tests -c Release
      - run: >
          dotnet publish src/AirPodsWin -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsWin-win-x64
          path: airpods/out/win-x64/AirPodsWin.exe
