name: facetime-messages
on:
  push:
    paths: ['facetime-messages/**', '.github/workflows/facetime-messages.yml']
  pull_request:
    paths: ['facetime-messages/**', '.github/workflows/facetime-messages.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facetime-messages
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  bluetooth-bridge:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: facetime-messages/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test MapBridge.Tests
      - run: dotnet publish MapBridge -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: MapBridge-win-x64
          path: facetime-messages/native/out/MapBridge.exe
