name: facetime-messages
on:
  push:
    paths: ['facetime-messages/**', '.github/workflows/facetime-messages.yml']
  pull_request:
    paths: ['facetime-messages/**', '.github/workflows/facetime-messages.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facetime-messages
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
